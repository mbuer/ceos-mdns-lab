no aaa root
!
no service interface inactive port-id allocation disabled
!
service routing protocols model multi-agent
!
hostname ceos2
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
interface Ethernet1
   no switchport
   ip address 10.10.20.1/30
   ip igmp
   mdns ipv4 link client2-link
   pim ipv4 sparse-mode
!
interface Ethernet2
   no switchport
   ip address 10.10.20.5/30
   ip igmp
   mdns ipv4 link client4-link
   pim ipv4 sparse-mode
!
interface Ethernet3
   no switchport
   ip address 10.10.20.9/30
   ip igmp
   mdns ipv4 link client6-link
   pim ipv4 sparse-mode
!
interface Ethernet4
   no switchport
   ip address 10.10.20.13/30
   ip igmp
   mdns ipv4 link client8-link
   pim ipv4 sparse-mode
!
interface Ethernet5
   no switchport
   ip address 10.10.20.17/30
   ip igmp
   mdns ipv4 link client10-link
   pim ipv4 sparse-mode
!
interface Ethernet48
   no switchport
   ip address 10.10.100.2/30
   ip ospf network point-to-point
   pim ipv4 sparse-mode
!
ip routing
!
mdns
   no disabled
   remote-gateway ipv4 10.10.100.1
   dso server ipv4
   !
   service test
      type any
      query Ethernet1, Ethernet2, Ethernet3, Ethernet4, Ethernet5
      response interface Ethernet1, Ethernet2, Ethernet3, Ethernet4, Ethernet5
      response link client1-link client3-link client5-link client7-link client9-link
!
router multicast
   ipv4
      routing
!
router ospf 1
   router-id 2.2.2.2
   network 10.10.20.0/30 area 0.0.0.0
   network 10.10.20.4/30 area 0.0.0.0
   network 10.10.20.8/30 area 0.0.0.0
   network 10.10.20.12/30 area 0.0.0.0
   network 10.10.20.16/30 area 0.0.0.0
   network 10.10.100.0/30 area 0.0.0.0
   max-lsa 12000
!
router pim sparse-mode
   ipv4
      rp address 10.10.100.1
!
end
