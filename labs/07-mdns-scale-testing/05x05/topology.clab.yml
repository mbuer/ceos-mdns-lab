    - endpoints: ["client1:eth1", "ceos1:eth1"]
    - endpoints: ["client3:eth1", "ceos1:eth2"]
    - endpoints: ["client5:eth1", "ceos1:eth3"]
    - endpoints: ["client7:eth1", "ceos1:eth4"]
