name: mdns-scale

topology:
  nodes:
    ceos1:
      kind: arista_ceos
      image: ceos:4.36.1F
      startup-config: config/ceos1.cfg

    ceos2:
      kind: arista_ceos
      image: ceos:4.36.1F
      startup-config: config/ceos2.cfg

    client1:
      kind: linux
      image: lab-endpoint:latest
      exec:
        - ip addr add 10.10.10.2/30 dev eth1
        - ip link set eth1 up
        - ip route add 10.10.20.0/27 via 10.10.10.1
        - ip route add 224.0.0.251/32 dev eth1

    client3:
      kind: linux
      image: lab-endpoint:latest
