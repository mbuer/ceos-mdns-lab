no aaa root
!
no service interface inactive port-id allocation disabled
!
service routing protocols model multi-agent
!
hostname ceos1
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
interface Ethernet1
   no switchport
   ip address 10.10.10.1/30
   mdns ipv4 link client1-link
   pim ipv4 sparse-mode
!
interface Ethernet2
   no switchport
   ip address 10.10.10.5/30
   mdns ipv4 link client3-link
   pim ipv4 sparse-mode
!
interface Ethernet3
   no switchport
   ip address 10.10.10.9/30
   mdns ipv4 link client5-link
   pim ipv4 sparse-mode
!
interface Ethernet4
   no switchport
   ip address 10.10.10.13/30
   mdns ipv4 link client7-link
   pim ipv4 sparse-mode
!
interface Ethernet5
   no switchport
   ip address 10.10.10.17/30
   mdns ipv4 link client9-link
   pim ipv4 sparse-mode
!
interface Ethernet6
   no switchport
   ip address 10.10.10.21/30
   mdns ipv4 link client11-link
   pim ipv4 sparse-mode
!
interface Ethernet7
   no switchport
   ip address 10.10.10.25/30
   mdns ipv4 link client13-link
   pim ipv4 sparse-mode
!
interface Ethernet8
   no switchport
   ip address 10.10.10.29/30
   mdns ipv4 link client15-link
   pim ipv4 sparse-mode
!
interface Ethernet9
   no switchport
   ip address 10.10.10.33/30
   mdns ipv4 link client17-link
   pim ipv4 sparse-mode
!
interface Ethernet10
   no switchport
   ip address 10.10.10.37/30
   mdns ipv4 link client19-link
   pim ipv4 sparse-mode
!
interface Ethernet48
   no switchport
   ip address 10.10.100.1/30
   ip ospf network point-to-point
   pim ipv4 sparse-mode
!
ip routing
!
mdns
   no disabled
   remote-gateway ipv4 10.10.100.2
   dso server ipv4
   !
   service test
      type any
      query Ethernet1, Ethernet2, Ethernet3, Ethernet4, Ethernet5, Ethernet6, Ethernet7, Ethernet8, Ethernet9, Ethernet10
      response interface Ethernet1, Ethernet2, Ethernet3, Ethernet4, Ethernet5, Ethernet6, Ethernet7, Ethernet8, Ethernet9, Ethernet10
      response link client2-link client4-link client6-link client8-link client10-link client12-link client14-link client16-link client18-link client20-link
!
router multicast
   ipv4
      routing
!
router ospf 1
   router-id 1.1.1.1
   network 10.10.10.0/30 area 0.0.0.0
   network 10.10.10.4/30 area 0.0.0.0
   network 10.10.10.8/30 area 0.0.0.0
   network 10.10.10.12/30 area 0.0.0.0
   network 10.10.10.16/30 area 0.0.0.0
   network 10.10.10.20/30 area 0.0.0.0
   network 10.10.10.24/30 area 0.0.0.0
   network 10.10.10.28/30 area 0.0.0.0
   network 10.10.10.32/30 area 0.0.0.0
   network 10.10.10.36/30 area 0.0.0.0
   network 10.10.100.0/30 area 0.0.0.0
   max-lsa 12000
!
router pim sparse-mode
   ipv4
      rp address 10.10.100.1
!
end
