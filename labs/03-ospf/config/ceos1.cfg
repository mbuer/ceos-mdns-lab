hostname ceos1

username admin privilege 15 role network-admin secret admin

ip routing

interface Ethernet1
   no switchport
   ip address 10.10.10.1/30
   no shutdown

interface Ethernet2
   no switchport
   ip address 10.10.100.1/30
   no shutdown

router ospf 1
   router-id 1.1.1.1
   network 10.10.10.0/30 area 0.0.0.0
   network 10.10.100.0/30 area 0.0.0.0
