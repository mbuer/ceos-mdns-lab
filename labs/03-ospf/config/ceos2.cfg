hostname ceos2

username admin privilege 15 role network-admin secret admin

ip routing

interface Ethernet1
   no switchport
   ip address 10.10.20.1/30
   no shutdown

interface Ethernet2
   no switchport
   ip address 10.10.100.2/30
   no shutdown

router ospf 1
   router-id 2.2.2.2
   network 10.10.20.0/30 area 0.0.0.0
   network 10.10.100.0/30 area 0.0.0.0
